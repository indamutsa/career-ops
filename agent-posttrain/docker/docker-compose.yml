services:
  db:
    image: postgres:16-alpine
    container_name: agentpt-db
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: shop
    ports:
      - "55432:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30
